tagline: I study how marketing and policy decisions shape what consumers buy, and how these decisions can be improved.

bio: |
  Niels Holtrop is Associate Professor at the Department of Marketing and Supply Chain Management at the School of Business and Economics (SBE) at Maastricht University. His research centers on the use of econometric and statistical methods to measure the impact of, and improve, marketing and policy decisions. His substantive interests include customer management and privacy, consumer choice and health, and marketing mix effectiveness.

  He has contributed to research published in the International Journal of Research in Marketing, Journal of Retailing, Management Science and Marketing Letters, and serves on the Editorial Review Board of the Journal of Retailing. He was awarded the 2018 EMAC/Sheth Dissertation Award and the 2026 EMAC/Sheth Sustainability Award for his research, the 2019 Best Graduate Educator Award of SBE for his teaching, and the 2021 Best Program Leader Award of SBE for his service. He is one of the co-founders of the Center for Responsible Retailing at Maastricht University (CRRUM).

